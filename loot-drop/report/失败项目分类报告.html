<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创业失败项目分类报告</title>
<meta name="description" content="1742 个创业失败项目的 AI 分类报告，按 13 个行业归堆，含 7 维标签分析（子行业、商业模式、技术栈、目标用户、融资阶段、死因模式）。">
<meta property="og:title" content="创业失败项目分类报告 | Loot Drop">
<meta property="og:description" content="1742 个失败项目按 13 个行业归堆分析，含商业模式、技术栈、死因模式等 7 维标签，支持多维筛选。">
<meta property="og:type" content="website">
<meta property="og:image" content="https://fayelin12.github.io/loot-drop/og-cover-report.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="创业失败项目分类报告 | Loot Drop">
<meta name="twitter:description" content="1742 个失败项目 × 13 个行业分组 × 7 维标签，可交互筛选。">
<meta name="twitter:image" content="https://fayelin12.github.io/loot-drop/og-cover-report.png">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background:#f5f5f5; color:#333; }
.header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); color:white; padding:32px 24px; }
.header .top-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.header h1 { font-size:28px; }
.header .stats { font-size:14px; opacity:0.8; margin-top:12px; display:flex; gap:24px; flex-wrap:wrap; }
.filters { background:white; padding:16px 24px; border-bottom:1px solid #e0e0e0; position:sticky; top:0; z-index:100; display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
.filters label { font-size:13px; font-weight:600; color:#555; }
.filters select, .filters input { padding:8px 12px; border:1px solid #ddd; border-radius:6px; font-size:13px; min-width:140px; }
.filters input { flex:1; min-width:200px; max-width:400px; }
.container { max-width:1400px; margin:0 auto; padding:24px; }
.group-section { margin-bottom:32px; }
.group-header { background:white; padding:14px 20px; border-radius:8px 8px 0 0; border-bottom:2px solid #0f3460; display:flex; justify-content:space-between; align-items:center; cursor:pointer; position:sticky; top:var(--sticky-top, 57px); z-index:50; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
.group-header h2 { font-size:18px; color:#0f3460; }
.group-header .count { background:#0f3460; color:white; padding:3px 12px; border-radius:12px; font-size:13px; }
.group-header .arrow { font-size:11px; margin-left:6px; display:inline-block; transition:transform 0.2s; }
.collapsed .group-header .arrow { transform:rotate(-90deg); }
.group-items { display:grid; grid-template-columns:repeat(auto-fill, minmax(360px, 1fr)); gap:12px; padding:12px 0; }
.card { background:white; border-radius:8px; padding:16px; border:1px solid #e8e8e8; contain:layout style paint; }
.card:hover { border-color:#0f3460; }
.card .name { font-size:15px; font-weight:700; color:#0f3460; flex:1; min-width:0; }
.card .title-row { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin:-16px -16px 8px -16px; padding:10px 16px; background:linear-gradient(135deg, #f0f4f8 0%, #e8edf2 100%); border-radius:8px 8px 0 0; border-bottom:1px solid #dde3ea; }
.card .value-prop { font-size:12px; color:#555; line-height:1.4; margin-bottom:8px; display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden; }
.card .meta { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
.card .tag { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; }
.tag-sector { background:#e3f2fd; color:#1565c0; }
.tag-cause { background:#fce4ec; color:#c62828; }
.tag-model { background:#e8f5e9; color:#2e7d32; }
.tag-stage { background:#fff3e0; color:#e65100; }
.tag-user { background:#f3e5f5; color:#6a1b9a; }
.tag-tech { background:#e0f7fa; color:#00695c; }
.card .cause { font-size:12px; color:#666; line-height:1.5; margin-top:6px; margin-bottom:8px; padding-top:8px; border-top:1px solid #e0e0e0; }
.card .props { font-size:12px; color:#888; white-space:nowrap; }
.no-results { text-align:center; padding:40px; color:#999; font-size:16px; }
.collapsed .group-items { display:none; }
.loading-hint { grid-column:1/-1; text-align:center; padding:12px; color:#999; font-size:13px; }
.card .detail-btn { font-size:11px; color:#0f3460; cursor:pointer; margin-left:auto; padding:2px 10px; border:1px solid #0f3460; border-radius:4px; white-space:nowrap; transition:all 0.15s; }
.card .detail-btn:hover { background:#0f3460; color:#fff; }
.modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:9999; display:flex; align-items:center; justify-content:center; }
.modal-box { background:white; border-radius:12px; max-width:640px; width:90vw; max-height:80vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
.modal-header { padding:20px 24px 12px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center; }
.modal-header h3 { font-size:18px; color:#0f3460; }
.modal-close { background:none; border:none; font-size:22px; cursor:pointer; color:#999; padding:4px 8px; }
.modal-close:hover { color:#333; }
.modal-body { padding:16px 24px 24px; font-size:14px; line-height:1.8; color:#333; white-space:pre-wrap; }
.home-btn { display:inline-block; padding:6px 16px; border:1px solid rgba(255,255,255,0.4); border-radius:6px; color:#fff; font-size:13px; text-decoration:none; transition:all 0.15s; }
.home-btn:hover { background:rgba(255,255,255,0.15); border-color:rgba(255,255,255,0.8); }
@media(max-width:768px){
  .header{padding:20px 16px}
  .header h1{font-size:20px}
  .header .top-row{flex-wrap:wrap;gap:8px}
  .header .stats{font-size:12px;gap:12px}
  .filters{padding:10px 12px;gap:6px;flex-direction:column;align-items:stretch}
  .filters label{display:none}
  .filters select,.filters input{width:100%;min-width:auto;max-width:none;font-size:14px}
  .filters button{width:100%;text-align:center}
  .container{padding:12px}
  .group-section{margin-bottom:20px}
  .group-header{padding:10px 14px}
  .group-header h2{font-size:15px}
  .group-header h2 span{display:none}
  .group-header .count{font-size:11px;padding:2px 8px}
  .group-items{grid-template-columns:1fr;gap:8px}
  .card{padding:12px}
  .card .title-row{margin:-12px -12px 6px -12px;padding:8px 12px;flex-wrap:wrap}
  .card .name{font-size:14px}
  .card .props{font-size:11px;white-space:normal}
  .card .value-prop{font-size:11px;margin-bottom:6px}
  .card .meta{gap:4px;margin-bottom:6px}
  .card .tag{font-size:10px;padding:1px 6px}
  .card .cause{font-size:11px;padding-top:6px;margin-top:4px;margin-bottom:6px}
  .modal-box{width:95vw;max-height:90vh;border-radius:8px}
  .modal-header{padding:14px 16px 10px}
  .modal-header h3{font-size:16px}
  .modal-body{padding:12px 16px 16px;font-size:13px;line-height:1.6}
}
</style>
</head>
<body>

<div class="header">
  <div class="top-row"><h1>💀 创业失败项目分类报告</h1><a href="../创业失败数据库.html" class="home-btn">← 返回首页</a></div>
  <div class="stats" id="headerStats"></div>
</div>

<div class="filters">
  <label>🔍 搜索</label>
  <input type="text" id="searchInput" placeholder="项目名 / 子行业 / 归堆关键词...">
  <label>死因</label>
  <select id="filterCause"><option value="">全部</option></select>
  <label>行业</label>
  <select id="filterSector"><option value="">全部</option></select>
  <label>阶段</label>
  <select id="filterStage"><option value="">全部</option></select>
  <label>国家</label>
  <select id="filterCountry"><option value="">全部</option></select>
  <button onclick="toggleAll()" style="padding:8px 16px;border:1px solid #ddd;border-radius:6px;background:white;cursor:pointer;font-size:13px;">展开/折叠全部</button>
</div>

<div class="container" id="app"></div>

<script src="data.js"></script>
<script>
// 数据从 data.js 加载 (window.__STARTUP_DATA__)，前端处理
const RAW = window.__STARTUP_DATA__ || [];

// 精简渲染数据
const ALL_DATA = RAW.map(p => ({
  name: p.name || "",
  value_proposition: p.value_proposition || "",
  sector: p.sector || "",
  product_type: p.product_type || "",
  cause_tag: p.cause_tag || "",
  cause_of_death_short: p.cause_of_death_short || "",
  cause_of_death: p.cause_of_death || "",
  end_year: p.end_year || "",
  country: p.country || "",
  total_funding: p.total_funding || 0,
  _tags: p._tags || null,
}));

// 前端归堆
const GROUPS = {};
ALL_DATA.forEach((p, i) => {
  const t = p._tags;
  if (!t) return;
  const g = t.similar_group || "__未归类__";
  if (!GROUPS[g]) GROUPS[g] = [];
  GROUPS[g].push(i);
});
// 按组大小排序
const sortedGroups = Object.entries(GROUPS).sort((a,b) => b[1].length - a[1].length);
const GROUPS_SORTED = {};
sortedGroups.forEach(([k,v]) => { GROUPS_SORTED[k] = v; });

// 构建下拉选项
function buildFilters() {
  const causes = new Set(), sectors = new Set(), stages = new Set(), countries = new Set();
  ALL_DATA.forEach(p => {
    if (p._tags?.failure_pattern) causes.add(p._tags.failure_pattern);
    if (p.sector) sectors.add(p.sector);
    if (p._tags?.growth_stage) stages.add(p._tags.growth_stage);
    if (p.country) countries.add(p.country);
  });
  const addOpts = (id, values) => {
    const sel = document.getElementById(id);
    [...values].sort().forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v + ' (' + [...values].filter(x => x===v).length + ')'; sel.appendChild(o); });
  };
  // 简化：直接插入 sorted unique
  [...causes].sort().forEach(v => { const o=document.createElement('option'); o.value=v; o.textContent=v; document.getElementById('filterCause').appendChild(o); });
  [...sectors].sort().forEach(v => { const o=document.createElement('option'); o.value=v; o.textContent=v; document.getElementById('filterSector').appendChild(o); });
  [...stages].sort().forEach(v => { const o=document.createElement('option'); o.value=v; o.textContent=v; document.getElementById('filterStage').appendChild(o); });
  [...countries].sort().forEach(v => { const o=document.createElement('option'); o.value=v; o.textContent=v; document.getElementById('filterCountry').appendChild(o); });
}

// 头部统计（跟随筛选动态变化）
function renderHeaderStats(items) {
  const sectors = new Set();
  const countries = new Set();
  const causes = {};
  const stages = new Set();
  items.forEach(i => {
    const p = ALL_DATA[i];
    if (p.sector) sectors.add(p.sector);
    if (p.country) countries.add(p.country);
    const cause = p._tags?.failure_pattern;
    if (cause) causes[cause] = (causes[cause] || 0) + 1;
    if (p._tags?.growth_stage) stages.add(p._tags.growth_stage);
  });
  const topCause = Object.entries(causes).sort((a, b) => b[1] - a[1])[0];
  document.getElementById('headerStats').innerHTML =
    `<span>📊 当前项目: <b>${items.length}</b></span>` +
    `<span>🏭 覆盖行业: <b>${sectors.size}</b></span>` +
    `<span>🌍 覆盖国家: <b>${countries.size}</b></span>` +
    `<span>📈 涉及阶段: <b>${stages.size}</b></span>` +
    `<span>💀 首要死因: <b>${topCause ? topCause[0] : '-'} (${topCause ? topCause[1] : 0})</b></span>`;
}

// 过滤
function getFilters() {
  return {
    search: document.getElementById('searchInput').value.toLowerCase(),
    cause: document.getElementById('filterCause').value,
    sector: document.getElementById('filterSector').value,
    stage: document.getElementById('filterStage').value,
    country: document.getElementById('filterCountry').value,
  };
}

function matches(project, f) {
  if (f.search) {
    const haystack = [
      project.name, project._tags?.sub_sector, project._tags?.similar_group,
      project._tags?.business_model, project._tags?.failure_pattern,
      project.sector, project.product_type, project.cause_tag
    ].filter(Boolean).join(' ').toLowerCase();
    if (!haystack.includes(f.search)) return false;
  }
  if (f.cause && project._tags?.failure_pattern !== f.cause) return false;
  if (f.sector && project.sector !== f.sector) return false;
  if (f.stage && project._tags?.growth_stage !== f.stage) return false;
  if (f.country && project.country !== f.country) return false;
  return true;
}

function renderCard(p) {
  const t = p._tags || {};
  let h = `<div class="card">`;
  h += `<div class="title-row"><div class="name">${p.name || '?'}</div><div class="props">${p.country || '?'} · ${p.end_year || '?'} · ${p.sector || '?'}</div></div>`;
  if (p.value_proposition) h += `<div class="value-prop"><b>简介：</b>${p.value_proposition}</div>`;
  h += '<div class="meta">';
  if (t.business_model) h += `<span class="tag tag-model">${t.business_model}</span>`;
  if (t.growth_stage) h += `<span class="tag tag-stage">${t.growth_stage}</span>`;
  if (t.target_user) h += `<span class="tag tag-user">${t.target_user}</span>`;
  if (t.sub_sector) h += `<span class="tag tag-sector">${t.sub_sector}</span>`;
  h += '</div>';
  if (t.tech_stack?.length) {
    h += '<div class="meta">';
    t.tech_stack.slice(0,4).forEach(tech => { h += `<span class="tag tag-tech">${tech}</span>`; });
    h += '</div>';
  }
  if (p.cause_of_death_short) h += `<div class="cause"><b>死因：</b>${p.cause_of_death_short}</div>`;
  h += '<div class="meta">';
  if (p.cause_tag) h += `<span class="tag tag-cause">${p.cause_tag}</span>`;
  if (t.failure_pattern) h += `<span class="tag tag-cause">${t.failure_pattern}</span>`;
  if (p.cause_of_death) h += `<span class="detail-btn" onclick="event.stopPropagation();showDetail('${p.name.replace(/'/g,"\'")}')">死因详情 →</span>`;
  h += '</div>';
  h += '</div>';
  return h;
}

function expandGroup(e) {
  const section = e.currentTarget.parentElement;
  section.classList.toggle('collapsed');
  const container = section.querySelector('.group-items');
  if (container.children.length > 0) return; // 已渲染过
  const indices = JSON.parse(e.currentTarget.dataset.indices || '[]');
  if (indices.length === 0) return;

  if (indices.length <= 80) {
    // 小组：一次性渲染
    let html = '';
    for (const idx of indices) html += renderCard(ALL_DATA[idx]);
    container.innerHTML = html;
  } else {
    // 大组：分批渲染，每批 50 张，用 setTimeout 让浏览器在批次间绘制
    container.innerHTML = '<div class="loading-hint">加载中...</div>';
    let html = '';
    let pos = 0;
    const BATCH = 50;
    function renderNext() {
      const end = Math.min(pos + BATCH, indices.length);
      for (let i = pos; i < end; i++) html += renderCard(ALL_DATA[indices[i]]);
      container.innerHTML = html;
      pos = end;
      if (pos < indices.length) {
        container.insertAdjacentHTML('beforeend',
          `<div class="loading-hint">已加载 ${pos}/${indices.length}...</div>`);
        setTimeout(renderNext, 0);
      }
    }
    setTimeout(renderNext, 0);
  }
}

// 死因详情弹窗
function showDetail(name) {
  const p = ALL_DATA.find(item => item.name === name);
  if (!p) return;
  const cause = p.cause_of_death || '暂无详情';
  // 在中文句号、问号、感叹号和英文句号后换行分段
  const formatted = cause
    .replace(/([。！？])\s*/g, '$1\n\n')
    .replace(/\.\s+(?=[A-Z])/g, '.\n\n');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-box">
    <div class="modal-header">
      <h3>💀 ${p.name}</h3>
      <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
    </div>
    <div class="modal-body">${formatted}</div>
  </div>`;
  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

// 分组名称映射表
const GROUP_LABELS = {
  "enterprise_software": "企业服务 / SaaS",
  "entertainment_media": "内容与娱乐",
  "infrastructure": "技术基础设施",
  "fintech": "金融科技",
  "social_network": "社交网络",
  "ecommerce": "电子商务",
  "hardware_iot": "硬件与物联网",
  "mobility": "出行与交通",
  "healthcare": "医疗健康",
  "edtech": "在线教育",
  "o2o_local": "本地生活 / O2O",
  "real_estate": "房产与空间",
  "clean_tech": "清洁技术 / 新能源",
  "__未归类__": "未归类"
};

// 渲染（首组默认展开，其余按需加载）
function render() {
  const f = getFilters();
  const app = document.getElementById('app');

  // 第一遍：收集所有可见分组
  const visibleGroups = [];
  for (const [gname, indices] of sortedGroups) {
    const visibleItems = indices.filter(i => matches(ALL_DATA[i], f));
    if (visibleItems.length === 0) continue;
    visibleGroups.push({ gname, indices: visibleItems });
  }

  // 更新头部动态统计
  const allIndices = visibleGroups.flatMap(g => g.indices);
  renderHeaderStats(allIndices);

  let html = '';
  let groupIdx = 0;
  for (const { gname, indices: visibleItems } of visibleGroups) {

    const ssCount = {};
    visibleItems.forEach(i => {
      const s = ALL_DATA[i]._tags?.sub_sector;
      if (s) ssCount[s] = (ssCount[s] || 0) + 1;
    });
    const subsector = Object.entries(ssCount).sort((a,b) => b[1] - a[1])[0]?.[0] || '';
    const gid = gname.replace(/[^a-zA-Z0-9_]/g,'_');
    const autoExpand = groupIdx === 0 && visibleItems.length <= 300;
    const collapsedClass = autoExpand ? '' : 'collapsed';

    html += `<div class="group-section ${collapsedClass}" id="group_${gid}">`;
    html += `<div class="group-header" onclick="expandGroup(event)" data-indices='${JSON.stringify(visibleItems)}'>`;
    const displayName = GROUP_LABELS[gname] || gname;
    html += `<h2>📦 ${displayName} <span style="font-size:14px;color:#888;font-weight:normal;">${subsector}</span></h2>`;
    html += `<span class="count">${visibleItems.length} 个项目 <span class="arrow">▼</span></span></div>`;

    html += `<div class="group-items"></div></div>`;
    groupIdx++;
  }

  if (allIndices.length === 0) {
    html += '<div class="no-results">😕 没有匹配的项目，试试调整筛选条件</div>';
  }

  app.innerHTML = html;

  // 首组延迟展开：页面先渲染完毕，再用分批渲染加载首组卡片
  if (groupIdx > 0) {
    const firstSection = document.querySelector('.group-section');
    if (firstSection && !firstSection.classList.contains('collapsed')) {
      const container = firstSection.querySelector('.group-items');
      const indices = JSON.parse(firstSection.querySelector('.group-header').dataset.indices || '[]');
      if (indices.length > 0 && container.children.length === 0) {
        let html = '';
        let pos = 0;
        const BATCH = 50;
        function renderFirstBatch() {
          const end = Math.min(pos + BATCH, indices.length);
          for (let i = pos; i < end; i++) html += renderCard(ALL_DATA[indices[i]]);
          container.innerHTML = html;
          pos = end;
          if (pos < indices.length) {
            container.insertAdjacentHTML('beforeend',
              `<div class="loading-hint">已加载 ${pos}/${indices.length}...</div>`);
            setTimeout(renderFirstBatch, 0);
          }
        }
        setTimeout(renderFirstBatch, 0);
      }
    }
  }
}

// 初始化
document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('filterCause').addEventListener('change', render);
document.getElementById('filterSector').addEventListener('change', render);
document.getElementById('filterStage').addEventListener('change', render);
document.getElementById('filterCountry').addEventListener('change', render);

function toggleAll() {
  document.querySelectorAll('.group-section').forEach(s => {
    const ev = { currentTarget: s.querySelector('.group-header') };
    if (s.classList.contains('collapsed')) expandGroup(ev);
    else s.classList.add('collapsed');
  });
}

buildFilters();
render();

// 动态计算筛选栏高度，设置分组标题吸顶位置
function updateStickyTop() {
  var f = document.querySelector('.filters');
  if (f) document.documentElement.style.setProperty('--sticky-top', f.offsetHeight + 'px');
}
updateStickyTop();
window.addEventListener('resize', updateStickyTop);
</script>
</body>
</html>
